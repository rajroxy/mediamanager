<style>
/* Video control bar — docked underneath the video area instead of floating over it */
#vpFloatBar{
  position: static;
  flex: 0 0 auto;
  margin-top: 10px;
  background: #fff;
  border: 1px solid #eaeaea;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
/* White bar, Geist/Vercel style: hairline gray borders, black primary play button */
#vpFloatBar .mv-btn{
  color: #000 !important;
  border: 1px solid #e5e5e5 !important;
}
#vpFloatBar .mv-btn:hover{ background: #fafafa !important; }
#vpFloatBar .mv-btn.active{ background: #f0f0f0 !important; }
#vpFloatBar .mv-play{ background: #000 !important; color: #fff !important; border: 1px solid #000 !important; }
#vpFloatBar .mv-play i{ color: #fff !important; }
#vpFloatBar .mv-play:hover{ background: #333 !important; }
#vpFloatBar .vp-divider{ background: #eaeaea !important; }
#vpFloatBar .vp-time,
#vpFloatBar .vp-vol-pct,
#vpFloatBar .vp-aspect-pct{ color: #666 !important; }

/* Playing bar — identical treatment to the music player's playing bar:
   a white capsule holding time · slider · time, flat track, round black thumb. */
/* Video seek — same capsule as the music player's seek bar */
html body #vpFloatBar .vp-group-seek{
  background: var(--surface-3) !important;
  border: 1px solid var(--line-2) !important;
  border-radius: var(--r-md,6px) !important;
  padding: 6px 12px !important;
  margin: 0 8px !important;
  gap: 10px !important;
  flex: 1 1 auto !important;
  min-width: 0 !important;  height:auto !important;
  box-sizing: border-box !important;
}
#vpFloatBar .vp-group-seek input[type="range"]{
  height: 4px !important;
  background: #eaeaea !important;
  border-radius: 2px !important;
  overflow: visible !important;   /* let the round thumb show, like the music bar */
}
#vpFloatBar .vp-group-seek input[type="range"]::-webkit-slider-runnable-track{
  height: 4px !important;
  background: #eaeaea !important;
  border-radius: 2px !important;
}
#vpFloatBar .vp-group-seek input[type="range"]::-webkit-slider-thumb{
  width: 12px !important;
  height: 12px !important;
  border-radius: 50% !important;
  background: #000 !important;
  border: none !important;
  margin-top: -4px !important;
}
#vpFloatBar .vp-group-seek input[type="range"]::-moz-range-thumb{
  width: 12px !important;
  height: 12px !important;
  border-radius: 50% !important;
  background: #000 !important;
  border: none !important;
}
/* Video stage — Vercel-style rounded corners that hold while the video plays.
   layout.css uses overflow:clip with a 260px clip-margin, which clips square
   corners and lets the video bleed past the radius; hidden + radius fixes it. */
#videoStage{
  border-radius: var(--r-lg, 8px);
  overflow: hidden;
  overflow-clip-margin: 0;
}

/* ═══ Music player — Vercel style (Geist) ═══ */
/* Play button: black pill, white glyph — the single primary control */
#musicPanel .mv-play,
.music-body .mv-play{
  background: #000 !important;
  color: #fff !important;
  border: 1px solid #000 !important;
  border-radius: 6px !important;
}
#musicPanel .mv-play i,
.music-body .mv-play i{ color: #fff !important; }
#musicPanel .mv-play:hover,
.music-body .mv-play:hover{ background: #333 !important; }
/* Secondary transport buttons: hairline outlines */
#musicPanel .mv-controls .mv-btn,
.music-body .mv-controls .mv-btn{
  color: #000 !important;
  border: 1px solid #e5e5e5 !important;
  border-radius: 6px !important;
}
#musicPanel .mv-controls .mv-btn:hover,
.music-body .mv-controls .mv-btn:hover{ background: #fafafa !important; }
/* Play stays the one solid black control, even inside the outlined row */
#musicPanel .mv-controls .mv-play,
.music-body .mv-controls .mv-play{
  background: #000 !important;
  color: #fff !important;
  border: 1px solid #000 !important;
}
#musicPanel .mv-controls .mv-play i,
.music-body .mv-controls .mv-play i{ color: #fff !important; }
#musicPanel .mv-controls .mv-play:hover,
.music-body .mv-controls .mv-play:hover{ background: #333 !important; }
/* Playlist area sized for a full 5-row page (5×52px rows + 4×2px gaps) and
   free to grow when the panel has spare room — extra height goes to the
   playlist body, never to the bottom pager bar */
#musicPanel .mv-playlist-wrap{
  flex: 1 1 auto !important;
  min-height: 300px !important;   /* playlist head (32px) + full 5-row page (268px) */
}
#musicPanel .mv-playlist{
  flex: 1 1 auto !important;
  height: auto !important;
  min-height: 268px !important;
  max-height: none !important;
}
/* Bottom pager bar — same shape as the video playlist panel's .vpl-pager */
#musicPanel > .mv-pager{
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 8px !important;
  padding: 8px 14px !important;
  border-top: 1px solid var(--line) !important;
  height: auto !important;
  min-height: 0 !important;
  box-sizing: border-box !important;
}
/* Video playlist row actions (play · rename · close) — ghost buttons, matching the music rows */
#videoPlaylistPanel .vpl-play,
#videoPlaylistPanel .vpl-rename,
#videoPlaylistPanel .vpl-del{
  padding: 0 !important;
  line-height: 1 !important;
}
#videoPlaylistPanel .vpl-play:hover,
#videoPlaylistPanel .vpl-rename:hover,
#videoPlaylistPanel .vpl-del:hover{
  background: var(--overlay-strong) !important;
  color: var(--ink) !important;
}
#videoPlaylistPanel .vpl-play i,
#videoPlaylistPanel .vpl-rename i,
#videoPlaylistPanel .vpl-del svg{
  pointer-events: none !important;
}
/* Inline rename field */
#videoPlaylistPanel .vpl-rename-edit{
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  font: inherit !important;
  font-size: 12.5px !important;
  line-height: 1.35 !important;
  color: var(--ink) !important;
  background: var(--surface-1) !important;
  border: 1px solid var(--line-3) !important;
  border-radius: 4px !important;
  padding: 1px 5px !important;
  margin: -2px 0 0 !important;
  outline: none !important;
  box-shadow: none !important;
}

/* Empty playlist — no icon, just the "+ to add" hint */
#videoPlaylistPanel .vpl-empty{
  padding: 46px 20px !important;
}
.vpl-empty-hint{
  font-size: 12.5px !important;
  color: var(--ink-3) !important;
  line-height: 1.5 !important;
}
.vpl-empty-key{
  color: var(--ink-2) !important;
  font-family: var(--mono) !important;
  font-weight: 600 !important;
}

/* Pager range label — same numbering system as the music player (page-last item) */
.vpl-range{
  flex: 1 1 auto !important;
  text-align: center !important;
  font-family: var(--mono) !important;
  font-size: 11px !important;
  font-weight: 500 !important;
  color: var(--ink-3) !important;
  font-variant-numeric: tabular-nums !important;
  letter-spacing: .02em !important;
  user-select: none !important;
}

/* Pager chevrons — Vercel hairline outline, matching the video player buttons */
#musicPanel .mv-pager-btn{
  display: flex !important;
  visibility: visible !important;
  opacity: 1 !important;
  width: 36px !important;
  height: 36px !important;
  color: #000 !important;
  border: 1px solid #e5e5e5 !important;
  border-radius: 6px !important;
  background: transparent !important;
  font-size: 14px !important;
}
#musicPanel .mv-pager-btn:hover{ background: #fafafa !important; }
#musicPanel .mv-pager-btn:disabled{ opacity: .3 !important; }
/* Volume button + percentage, matching the video player bar */
#musicPanel .mp-vol-btn,
.music-body .mp-vol-btn{ color: #000 !important; border: 1px solid #e5e5e5 !important; border-radius: 6px !important; }
#musicPanel .mp-vol-btn:hover,
.music-body .mp-vol-btn:hover{ background: #fafafa !important; }
#musicPanel .mp-vol-pct,
.music-body .mp-vol-pct{
  font-size: 11px;
  font-family: var(--mono);
  color: #666 !important;
  font-variant-numeric: tabular-nums;
  min-width: 32px;
  pointer-events: none;
}

/* Music control row: shuffle far left · prev/play/next + volume centred ·
   loop far right. The two outer zones are the same width, so the middle
   group always lands dead centre and nothing can overlap. */
#musicPanel .mv-controls{
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 8px !important;
}
#musicPanel .mv-controls-left,
#musicPanel .mv-controls-center,
#musicPanel .mv-controls-right{
  display: flex !important;
  align-items: center !important;
  gap: 6px !important;
}
#musicPanel .mv-controls-left,
#musicPanel .mv-controls-right{
  flex: 0 0 36px !important;    /* equal sides keep the centre group centred */
  justify-content: center !important;
}
/* Volume button + percentage ride along with the transport in the centre */
#musicPanel .mv-volume{
  flex: 0 0 auto !important;
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  height: auto !important;
  padding: 0 !important;
  margin-left: 2px !important;
}
#musicPanel .mv-controls .mv-btn.active{
  background: #f0f0f0 !important;
  color: #000 !important;
  border-color: #e5e5e5 !important;
}
/* Playing bar — the same white docked bar as the video player's control bar */
#musicPanel .mv-seek{
  gap: 10px !important;
  background: #fff !important;
  border: 1px solid #eaeaea !important;
  border-radius: 6px !important;
  padding: 6px 12px !important;
  height: auto !important;
  box-sizing: border-box !important;
}
#musicPanel .mv-seek span{ color: #666 !important; }
/* Body takes the extra height; the chevron bar keeps its natural size.
   If the window is too short for the whole panel, the BODY scrolls —
   a row can never be clipped, and the pager bar never stretches. */
#musicPanel.panel-shell{
  height: 700px !important;
  max-height: calc(100vh - 40px) !important;
}
#musicPanel .music-body{
  flex: 1 1 auto !important;
  height: auto !important;
  min-height: 0 !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  justify-content: flex-start !important;
  scrollbar-width: none !important;
}
#musicPanel .music-body::-webkit-scrollbar{ display: none !important; width: 0 !important; }
#musicPanel > .mv-pager{ flex: 0 0 auto !important; }
#musicPanel .mv-seek input[type="range"],
#musicPanel .mv-seek input[type="range"]::-webkit-slider-runnable-track{
  height: 4px !important;
  background: #eaeaea !important;
  border-radius: 2px !important;
}
#musicPanel .mv-seek input[type="range"]::-webkit-slider-thumb{
  width: 12px !important;
  height: 12px !important;
  border-radius: 50% !important;
  background: #000 !important;
  border: none !important;
  margin-top: -4px !important;
}
#musicPanel .mv-seek input[type="range"]::-moz-range-thumb{
  width: 12px !important;
  height: 12px !important;
  border-radius: 50% !important;
  background: #000 !important;
  border: none !important;
}

/* CSS fallback fullscreen when the browser rejects requestFullscreen
   (e.g. right-click without enough user activation) */
.vp-fs-fallback{
  position: fixed !important;
  inset: 0 !important;
  z-index: 9999 !important;
  width: 100vw !important;
  height: 100vh !important;
  max-width: none !important;
  max-height: none !important;
  transform: none !important;
  border-radius: 0 !important;
  background: #000 !important;
  padding: 0 !important;
}
.vp-fs-fallback .video-stage{ border-radius: 0 !important; }
.vp-fs-fallback .vp-float-bar{ margin: 0 !important; border-radius: 0 !important; border-left: none !important; border-right: none !important; }
/* Pager chevrons — identical treatment to the shuffle / repeat buttons */
html body #musicPanel > .mv-pager .mv-pager-btn{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  width:36px !important;
  height:36px !important;
  padding:0 !important;
  background:var(--surface-3) !important;   /* same fill as shuffle / repeat */
  border:0 !important;                      /* kills the old white hairline */
  border-radius:var(--r-md,6px) !important;
  color:var(--ink-2) !important;
  font-size:14px !important;
  opacity:1 !important;
  visibility:visible !important;
}
html body #musicPanel > .mv-pager .mv-pager-btn:hover{
  background:var(--surface-4) !important;
  color:var(--ink) !important;
}
html body #musicPanel > .mv-pager .mv-pager-btn:disabled{ opacity:.45 !important; }

/* Music play button — the video player's colour (no white), nothing else touched */
html body #musicPanel .mv-play,
html body #musicPanel .mv-controls .mv-play,
html body .music-body .mv-controls .mv-play{
  background:var(--accent) !important;
  border:0 !important;
  border-radius:var(--r-md,6px) !important;
}
html body #musicPanel .mv-play i,
html body #musicPanel .mv-controls .mv-play i{ color:var(--accent-ink) !important; }
html body #musicPanel .mv-play:hover,
html body #musicPanel .mv-controls .mv-play:hover{ background:var(--accent-2) !important; }
/* ═══════════════════════════════════════════════════════════
   MUSIC PLAYER — video player's frame · black stage · one bar
   ═══════════════════════════════════════════════════════════ */

/* 1 · same frame and size as the video player */
html body #musicPanel.panel-shell{
  width:min(880px, calc(100vw - 80px)) !important;
  height:min(560px, calc(100vh - 140px)) !important;
  min-height:0 !important;
  max-height:calc(100vh - 140px) !important;
}

/* 2 · two rows: the stage (fills) + one bar (hugs) */
html body #musicPanel .music-body{
  display:grid !important;
  grid-template-rows:1fr auto !important;
  grid-template-columns:auto auto auto auto minmax(0,1fr) auto auto !important;
  gap:0 8px !important;
  min-height:0 !important;
  overflow:hidden !important;
}

/* ── row 1 · the black stage — full width, no outline ── */
html body #musicPanel .mv-now-row{
  grid-row:1 !important; grid-column:1 !important;
  display:flex !important; align-items:stretch !important;
  min-height:0 !important; background:transparent !important;
  border:0 !important; box-shadow:none !important;
}
html body #musicPanel .mv-now{
  height:100% !important; width:100% !important;
  flex:1 1 auto !important; flex-basis:auto !important;
  min-height:0 !important; background:#000 !important;
  border:0 !important; box-shadow:none !important;
  border-radius:var(--r-lg,8px) !important; overflow:hidden !important;
}
html body #musicPanel .mv-visualizer{ height:100% !important; background:transparent !important; }
html body #musicPanel .mv-visualizer span{ max-width:9px !important; background:var(--ink) !important; }

@keyframes mvVisScreen{ from{ height:3%; } to{ height:88%; } }
html body #musicPanel .mv-visualizer.playing span{ animation:mvVisScreen 800ms ease-in-out infinite alternate !important; }
html body #musicPanel .mv-visualizer.playing span:nth-child(4n+1){ animation-duration:700ms !important; }
html body #musicPanel .mv-visualizer.playing span:nth-child(4n+2){ animation-duration:850ms !important; }
html body #musicPanel .mv-visualizer.playing span:nth-child(4n+3){ animation-duration:620ms !important; }
html body #musicPanel .mv-visualizer.playing span:nth-child(4n+4){ animation-duration:780ms !important; }

/* ── row 2 · ONE bar — a copy of #vpFloatBar ── */
html body #musicPanel .music-body{
  display:grid !important;
  grid-template-rows:1fr auto !important;
  grid-template-columns:minmax(0,1fr) !important;
  gap:10px !important; padding:10px !important;
  min-height:0 !important; overflow:hidden !important;
}
html body #musicPanel .mv-controls{
  grid-row:2 !important; grid-column:1 !important;
  display:flex !important; align-items:center !important;
  gap:0 !important; padding:4px 8px !important;
  background:var(--surface-2) !important;   /* same as #vpFloatBar */
  border:0 !important; border-radius:var(--r-md,6px) !important;
  min-width:0 !important;
}
html body #musicPanel .mv-controls-center{
  display:flex !important; align-items:center !important;
  gap:2px !important; padding:0 6px !important; flex:0 0 auto !important;
}
html body #musicPanel .mv-controls-left,
html body #musicPanel .mv-controls-right{
  display:flex !important; align-items:center !important;
  gap:2px !important; padding:0 6px !important;
  flex:0 0 auto !important;                  /* kills the 78px box */
  justify-content:flex-start !important;
}
html body #musicPanel .mv-volume{
  display:flex !important; align-items:center !important;
  gap:8px !important; padding:0 6px !important; flex:0 0 auto !important;
}
html body #musicPanel .mv-seek{
  flex:1 1 auto !important; min-width:0 !important;
  gap:10px !important; padding:4px 12px !important; margin:0 2px !important;
  background:var(--surface-3) !important; border:0 !important;
  border-radius:var(--r-md,6px) !important;
}

/* the four hairlines, in the video bar's positions */
html body #musicPanel .mv-controls-center::before,
html body #musicPanel .mv-controls-center::after,
html body #musicPanel .mv-volume::before,
html body #musicPanel .mv-controls-right::before{
  content:'' !important; flex:0 0 1px !important;
  width:1px !important; height:20px !important;
  margin:0 6px !important; background:var(--line) !important;
}

/* ── the two align dots — in the bar, after Loop, stacked vertically ── */
html body #musicPanel .mv-controls-right .mv-align-dots{
  display:flex !important; flex-direction:column !important;
  gap:4px !important; width:auto !important;
  align-items:center !important; margin-left:6px !important;
}
html body #musicPanel .mv-align-dot{ width:8px !important; height:8px !important; }
html body #musicPanel .mv-align-dot:hover{ border-color:rgba(255,255,255,.7) !important; }
html body #musicPanel .mv-align-dot.active{ background:var(--ink) !important; border-color:var(--ink) !important; }

/* 4 · one bar, the video order:
      playlist · prev · play · next · seek · volume · shuffle + loop */
html body #musicPanel .mv-controls,
html body #musicPanel .mv-controls-center{ display:contents !important; }

html body #musicPanel .mv-controls-left      { grid-row:2 !important; grid-column:1 !important; align-self:center !important; }
html body #musicPanel [data-act="mp-prev"]   { grid-row:2 !important; grid-column:2 !important; align-self:center !important; }
html body #musicPanel [data-act="mp-toggle"] { grid-row:2 !important; grid-column:3 !important; align-self:center !important; }
html body #musicPanel [data-act="mp-next"]   { grid-row:2 !important; grid-column:4 !important; align-self:center !important; }
html body #musicPanel .mv-seek               { grid-row:2 !important; grid-column:5 !important; align-self:center !important; }
html body #musicPanel .mv-volume             { grid-row:2 !important; grid-column:6 !important; align-self:center !important; }
html body #musicPanel .mv-controls-right     { grid-row:2 !important; grid-column:7 !important; align-self:center !important; }

/* 5 · chevrons — one style for both playlist panels */
html body .mv-pager-btn{
  width:36px !important; height:36px !important; padding:0 !important;
  display:flex !important; align-items:center !important; justify-content:center !important;
  background:var(--surface-3) !important; color:var(--ink-2) !important;
  border:0 !important; border-radius:var(--r-md,6px) !important;
  font-size:14px !important; opacity:1 !important; visibility:visible !important;
}
html body .mv-pager-btn:hover{ background:var(--surface-4) !important; color:var(--ink) !important; }
html body .mv-pager-btn:disabled{ opacity:.45 !important; }
}

/* ═══════ FINAL — music player: full-width stage + video-style bar ═══════ */
html body #musicPanel .music-body{
  display:flex !important; flex-direction:column !important;
  gap:10px !important; padding:10px !important;
  min-height:0 !important; overflow:hidden !important;
}
html body #musicPanel .mv-now-row{
  display:flex !important; flex:1 1 auto !important;
  align-items:stretch !important; width:100% !important;
  min-height:0 !important; background:transparent !important;
  border:0 !important; box-shadow:none !important;
}
html body #musicPanel .mv-now{
  flex:1 1 auto !important; flex-basis:auto !important;
  width:100% !important; height:100% !important; min-height:0 !important;
  background:#000 !important; border:0 !important; box-shadow:none !important;
  border-radius:var(--r-lg,8px) !important; overflow:hidden !important;
}
html body #musicPanel .mv-visualizer{ height:100% !important; background:transparent !important; }
html body #musicPanel .mv-visualizer span{ max-width:9px !important; background:var(--ink) !important; }
html body #musicPanel .mv-now-row .mv-align-dots{ display:none !important; }

html body #musicPanel .mv-controls{
  display:flex !important; flex:0 0 auto !important;
  align-items:center !important; gap:0 !important; width:100% !important;
  padding:4px 8px !important;
  background:var(--surface-2) !important; border:0 !important;
  border-radius:var(--r-md,6px) !important; min-width:0 !important;
}
html body #musicPanel .mv-controls-center{
  display:flex !important; align-items:center !important;

<script>
/* Apply the saved theme before the app renders */
try{
  /* Overlay panes render the app read-only — no writes, no chrome */
  var _p = new URLSearchParams(location.search);
  /* Which app is this window? Set on <body> before anything paints, so the
     standalone Player / Media Manager never flash the dashboard first. */
  var _app = _p.get('app');
  if(_app === 'player' || _app === 'manager'){
    window.SF_APP = _app;
    document.body.classList.add(_app === 'player' ? 'sf-app-player' : 'sf-app-manager');
    if(_app === 'player') document.body.classList.add('sf-player-only');
  }
  if(_p.get('sfView') === '1' && window.parent !== window){
    window.SF_VIEW = true;
    document.documentElement.classList.add('sf-view');
    document.body.classList.add('sf-view');
  }
  /* Paint the last used color theme from cache — no flash of the default */
  var _cfg = JSON.parse(localStorage.getItem('sf7_config') || '{}');
  var _th  = JSON.parse(localStorage.getItem('sf6_theme') || 'null');
  if(_th && _th.tokens){
    var _tokens = _th.tokens;
    Object.keys(_tokens).forEach(function(k){
      document.documentElement.style.setProperty(k, _tokens[k]);
      document.body.style.setProperty(k, _tokens[k]);
    });
    document.documentElement.style.colorScheme = _th.scheme || 'dark';
    document.body.style.colorScheme = _th.scheme || 'dark';
  }
  var _id = (_th && _th.id) || _cfg.theme || 'night';
  document.body.setAttribute('data-theme', _id);
  document.body.setAttribute('data-theme-resolved', (_th && _th.resolved) || _id);
}catch(e){}
</script>

<div class="panel-shell video-playlist-panel" id="videoPlaylistPanel" hidden>

  <div class="panel-head" id="videoPlaylistHead">
    <div class="vpl-title">
      <span>Playlist</span>
    </div>
    <div class="panel-head-actions">
      <button class="v-close" data-act="vpl-close" title="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 3L11 11M11 3L3 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="panel-body" id="videoPlaylistBody"></div>

  <div class="vpl-pager">
    <button class="mv-pager-btn" data-act="vpl-prev-page" title="Previous" disabled>
      <i class="bi bi-chevron-left"></i>
    </button>
    <span class="vpl-range" id="vplRange">1</span>
    <button class="mv-pager-btn" data-act="vpl-next-page" title="Next" disabled>
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

</div>

<!-- ═══════════ MUSIC PANEL ═══════════ -->
<div class="panel-shell music-panel" id="musicPanel" hidden>

  <div class="panel-head" id="musicPanelHead">
    <div class="panel-search" id="musicUrlWrap" hidden>
      <input class="panel-search-input" id="musicUrlInput" placeholder="Paste URL…">
    </div>
    <div class="panel-head-actions">
      <button class="panel-icon-btn" data-act="music-plus" title="Add URL (left-click) or pick file (right-click)">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button class="v-close" data-act="music-close" title="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 3L11 11M11 3L3 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="panel-body music-body">

    <!-- Visualizer -->
    <div class="mv-now-row">
    <div class="mv-now">
    <div class="mv-visualizer" id="mvVisualizer">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
  </div>
</div>

    <div class="mv-controls">

  <div class="mv-controls-left"></div>
  <div class="vp-divider"></div>

  <div class="mv-controls-center">
    <button class="mv-btn" data-act="mp-prev" title="Previous"><i class="bi bi-skip-start-fill"></i></button>
    <button class="mv-btn mv-play" data-act="mp-toggle" title="Play/Pause"><i class="bi bi-play-fill" id="mpPlayIcon"></i></button>
    <button class="mv-btn" data-act="mp-next" title="Next"><i class="bi bi-skip-end-fill"></i></button>
  </div>
  <div class="vp-divider"></div>

  <div class="mv-seek">
    <span id="mpCur">0:00</span>
    <input type="range" id="mpSeek" min="0" max="100" value="0">
    <span id="mpDur">0:00</span>
  </div>
  <div class="vp-divider"></div>

  <div class="mv-volume">
    <button class="mv-btn mp-vol-btn" id="mpVolBtn" title="Left-click: down · Right-click: up"><i class="bi bi-volume-up" id="mpVolIcon"></i></button>
    <span class="mp-vol-pct" id="mpVolPct">80%</span>
  </div>
  <div class="vp-divider"></div>

  <div class="mv-controls-right">
    <button class="mv-btn" data-act="mp-shuffle" title="Shuffle"><i class="bi bi-shuffle"></i></button>
    <button class="mv-btn" data-act="mp-repeat" title="Repeat"><i class="bi bi-repeat"></i></button>
  </div>

</div>



    <!-- Playlist -->
    <div class="mv-playlist-wrap">
      <div class="mv-playlist-head">
        <span>Playlist</span>
        <span class="mv-playlist-page" id="mpRange">1</span>
      </div>
      <div class="mv-playlist" id="mpPlaylist"></div>
    </div>

  </div>

  <!-- Bottom pager bar — mirrors the video playlist panel's .vpl-pager -->
  <div class="mv-pager" id="mvPager">
    <button class="mv-pager-btn" data-act="mp-prev-page" title="Previous" disabled>
      <i class="bi bi-chevron-left"></i>
    </button>
    <button class="mv-pager-btn" data-act="mp-next-page" title="Next" disabled>
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

</div>
<!-- Hidden audio element -->
<audio id="mpAudio" preload="metadata"></audio>

<!-- ═══════════ VIDEO MINI PLAYER ═══════════ -->
<div class="video-mini" id="videoMini" hidden>
  <div class="video-mini-head" id="videoMiniHead">
    <span class="video-mini-title" id="videoMiniTitle">Playing</span>
    <button class="video-mini-close" id="videoMiniClose" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M2 2L8 8M8 2L2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="video-mini-body" id="videoMiniBody"></div>
</div>

</body>
</html>
